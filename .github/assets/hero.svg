<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient & grid -->
  <rect width="1200" height="630" fill="#090A0F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2230" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#11131A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand Title & Tagline -->
  <g transform="translate(100, 100)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#2563EB"/>
    <path d="M18 20C18 18.8954 18.8954 18 20 18H36C37.1046 18 38 18.8954 38 20V32C38 33.1046 37.1046 34 36 34H26L20 38V34H20C18.8954 34 18 33.1046 18 32V20Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="white" letter-spacing="-0.5">AnonMsg</text>

    <!-- Main Headline -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">Say it anonymously.</text>
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Production-grade anonymous feedback web application with dual-token JWT auth.</text>
  </g>

  <!-- Visual Mockup Cards -->
  <!-- 1. Left Card: Public Submission -->
  <g transform="translate(100, 310)">
    <rect width="460" height="240" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Card header -->
    <circle cx="36" cy="36" r="16" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="31" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#60A5FA">@</text>
    <text x="64" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600" fill="#F8FAFC">Send anonymous message to @alex</text>
    
    <!-- Input box mock -->
    <rect x="24" y="70" width="412" height="95" rx="12" fill="#0B0E14" stroke="#1E293B"/>
    <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#E2E8F0">"Your mentorship helped me land my first tech internship!"</text>
    <text x="40" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Anonymous · 0 metadata captured</text>

    <!-- Send button mock -->
    <rect x="316" y="180" width="120" height="38" rx="10" fill="#2563EB"/>
    <text x="345" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="white">Send ↗</text>
  </g>

  <!-- 2. Right Card: Recipient Inbox Dashboard -->
  <g transform="translate(600, 310)">
    <rect width="500" height="240" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Dashboard header -->
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Private Dashboard</text>
    <!-- Toggle badge -->
    <rect x="340" y="26" width="130" height="26" rx="13" fill="#10B981" fill-opacity="0.15"/>
    <circle cx="355" cy="39" r="4" fill="#10B981"/>
    <text x="367" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34D399">Accepting Msgs</text>

    <!-- Message 1 -->
    <rect x="24" y="66" width="452" height="68" rx="12" fill="#0B0E14" stroke="#1E293B"/>
    <text x="40" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#F1F5F9">"The presentation yesterday was top notch!"</text>
    <text x="40" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">Received 2m ago · Protected by JWT</text>

    <!-- Message 2 -->
    <rect x="24" y="146" width="452" height="68" rx="12" fill="#0B0E14" stroke="#1E293B"/>
    <text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#F1F5F9">"Love the new UI changes on your portfolio."</text>
    <text x="40" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">Received 1h ago</text>
  </g>
</svg>
